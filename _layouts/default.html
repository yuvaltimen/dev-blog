<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body{% if page.layout == "post" or page.layout == "project" %} data-autohide-header{% endif %}>

    {%- if page.layout == "post" -%}
    <div class="reading-progress" id="reading-progress"></div>
    {%- endif -%}

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script src="{{ "/assets/js/main.js" | relative_url }}" defer></script>
  </body>

</html>
